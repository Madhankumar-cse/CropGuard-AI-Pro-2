<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CropGuard AI Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#071C13,#0B3D2E,#1B5E20);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.card{
width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:30px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}
button{
width:100%;
padding:15px;
background:#22C55E;
color:white;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
}
#result{margin-top:20px;display:none;}
</style>
</head>

<body>

<div class="card">

<h1>🌿 CropGuard AI Pro</h1>

<p>AI Farmer Copilot</p>

<input type="file" id="leaf" accept="image/*">

<br><br>

<button onclick="analyze()">
Analyze Leaf
</button>

<div id="result">
<h3>Tomato</h3>
<p>Disease: Late Blight</p>
<p>Confidence: 98%</p>
<p>Severity: High</p>
<p>Treatment: Apply Copper Fungicide</p>
</div>

</div>

<script>
function analyze(){
if(!document.getElementById("leaf").files.length){
alert("Upload an image");
return;
}
setTimeout(()=>{
document.getElementById("result").style.display="block";
},1200);
}
</script>

</body>
</html>
